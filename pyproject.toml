[project]
name = "mcp-norayngjingavel"
version = "0.1.0"
description = "Source extraction and URL crawling module for remote agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "lightgbm>=4.0.0",
    "marimo>=0.21.1",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pyarrow>=22.0.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
